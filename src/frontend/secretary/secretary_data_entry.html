<h3>Εισαγωγή Δεδομένων Χρηστών</h3>
<p>Εισάγετε τα δεδομένα των χρηστών (φοιτητών και καθηγητών) μέσω αρχείου JSON.</p>
<form action="backend/handlers/data_entry.php" method="POST" enctype="multipart/form-data">
    <div class="mb-3">
        <label for="jsonFile" class="form-label">Επιλέξτε αρχείο JSON</label>
        <input type="file" class="form-control" id="jsonFile" name="jsonFile" accept=".json" required>
        <div class="form-text">Το αρχείο πρέπει να περιέχει τα δεδομένα των φοιτητών και των καθηγητών σε μορφή JSON.</div>
    </div>
    <button type="submit" class="btn btn-primary" name="submit">Εισαγωγή Δεδομένων</button>
</form>
<div id="importResult" class="mt-3"></div>

<script>
// Προσθήκη χειριστή συμβάντος για την υποβολή της φόρμας
document.querySelector('form').addEventListener('submit', function(e) {
    // Αποτροπή της προεπιλεγμένης συμπεριφοράς υποβολής φόρμας
    e.preventDefault();
    
    // Δημιουργία αντικειμένου FormData για αποστολή του αρχείου
    const formData = new FormData(this);
    // Εύρεση του div για εμφάνιση αποτελεσμάτων
    const resultDiv = document.getElementById('importResult');
    
    // Αποστολή δεδομένων στον server μέσω AJAX
    fetch(this.action, {
        method: 'POST',
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        // Εμφάνιση μηνύματος επιτυχίας ή αποτυχίας
        resultDiv.innerHTML = `
            <div class="alert alert-${data.success ? 'success' : 'danger'}" role="alert">
                ${data.message}
            </div>
        `;
    })
    .catch(error => {
        // Διαχείριση σφαλμάτων επικοινωνίας
        resultDiv.innerHTML = `
            <div class="alert alert-danger" role="alert">
                Σφάλμα κατά την επικοινωνία με τον διακομιστή
            </div>
        `;
        console.error('Σφάλμα:', error);
    });
});
</script>
