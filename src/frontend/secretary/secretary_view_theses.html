<h3>Προβολή Λίστας Διπλωματικών</h3>
<p>Εμφάνιση όλων των διπλωματικών εργασιών του Τμήματος.</p>

<table class="table">
  <thead>
    <tr>
      <th scope="col">Θέμα</th>
      <th scope="col">Φοιτητής</th>
      <th scope="col">Επιβλέπων & Μέλη Τριμελούς</th>
      <th scope="col">Κατάσταση</th>
      <th scope="col">Ενέργειες</th>
    </tr>
  </thead>
  <tbody id="theses-table-body">
  </tbody>
</table>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Φόρτωση των διπλωματικών από το backend
    fetch('backend/api/secretary_view_theses.php')
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(theses => {
            // Εύρεση του πίνακα και καθαρισμός του περιεχομένου
            const tableBody = document.getElementById('theses-table-body');
            tableBody.innerHTML = '';
            if (theses.length > 0) {
                // Για κάθε διπλωματική, δημιουργία μιας νέας γραμμής στον πίνακα
                theses.forEach(thesis => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${thesis.title}</td>
                        <td>${thesis.student_name || '—'}</td>
                        <td>${thesis.committee_members || '—'}</td>
                        <td><span class="badge ${getStatusBadgeClass(thesis.status)}">${thesis.status.replace('_', ' ')}</span></td>
                        <td>
                            <a href='dashboard.php?page=manage_thesis&id=${thesis.thesis_id}' class='btn btn-sm btn-info'>Διαχείριση</a>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            } else {
                const row = document.createElement('tr');
                row.innerHTML = `<td colspan='5'>Δεν βρέθηκαν καταχωρημένες διπλωματικές εργασίες.</td>`;
                tableBody.appendChild(row);
            }
        })
        .catch(error => {
            console.error('Σφάλμα κατά τη φόρτωση των διπλωματικών:', error);
            const tableBody = document.getElementById('theses-table-body');
            tableBody.innerHTML = `<td colspan='5'>Σφάλμα κατά τη φόρτωση των δεδομένων. Παρακαλώ δοκιμάστε ξανά.</td>`;
        });
});

function getStatusBadgeClass(status) {
    const statusClasses = {
        'active': 'bg-success',
        'under_review': 'bg-info text-dark'
    };
    return statusClasses[status] || 'bg-secondary';
}
</script>
