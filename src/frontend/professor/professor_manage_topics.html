<!DOCTYPE html>
<html lang="el">
<head>
    <!-- Σελίδα διαχείρισης θεμάτων διπλωματικών εργασιών για καθηγητές -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Διαχείριση Θεμάτων</title>
    
    <!-- Bootstrap CSS για responsive design -->
    <link href="https://bootswatch.com/5/united/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <h3>Διαχείριση Θεμάτων Διπλωματικών Εργασιών</h3>
   
    <p>Εδώ ο καθηγητής μπορεί να δημιουργήσει ή να επεξεργαστεί θέματα.</p>

   
    <div class="card p-3 mb-4">
        <h4>Δημιουργία Νέου Θέματος</h4>
        <!-- Φόρμα δημιουργίας θέματος με επισύναψη PDF -->
        <form action="backend/handlers/handle_topic_creation.php" method="POST" enctype="multipart/form-data">
            <!-- Πεδίο τίτλου θέματος -->
            <div class="mb-3">
                <label for="title" class="form-label">Τίτλος Θέματος</label>
                <input type="text" class="form-control" id="title" name="title" required>
            </div>
            <!-- Πεδίο περιγραφής/σύνοψης -->
            <div class="mb-3">
                <label for="description" class="form-label">Περιγραφή (Σύνοψη)</label>
                <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
            </div>
            <!-- Πεδίο επισύναψης PDF αρχείου -->
            <div class="mb-3">
                <label for="pdfFile" class="form-label">Αναλυτική Παρουσίαση (PDF)</label>
                <input type="file" class="form-control" id="pdfFile" name="pdfFile">
            </div>
            <!-- Κουμπί υποβολής φόρμας -->
            <button type="submit" class="btn btn-primary">Αποθήκευση</button>
        </form>
    </div>

    <!-- Τίτλος λίστας υπαρχόντων θεμάτων -->
    <h4>Λίστα Υπαρχόντων Θεμάτων</h4>
    <!-- Πίνακας εμφάνισης θεμάτων με δυνατότητα επεξεργασίας -->
    <table class="table table-hover table-striped">
      <thead>
        <tr>
          <th scope="col">Τίτλος</th>
          <th scope="col">Ενέργειες</th>
        </tr>
      </thead>
      <tbody id="topics-table-body">
        </tbody>
    </table>

    <!-- Bootstrap JavaScript για interactive components -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
    // Αρχικοποίηση σελίδας - φόρτωση λίστας θεμάτων
    document.addEventListener('DOMContentLoaded', function() {
        // Κλήση API για λήψη λίστας θεμάτων του καθηγητή
        fetch('backend/api/get_topics.php')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(topics => {
                const tableBody = document.getElementById('topics-table-body');
                tableBody.innerHTML = '';
                
                // Εμφάνιση θεμάτων στον πίνακα
                if (topics.length > 0) {
                    topics.forEach(topic => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${topic.title}</td>
                            <td><a href='dashboard.php?page=edit_topic&id=${topic.id}' class='btn btn-sm btn-info'>Επεξεργασία</a></td>
                        `;
                        tableBody.appendChild(row);
                    });
                } else {
                    // Μήνυμα όταν δεν υπάρχουν θέματα
                    const row = document.createElement('tr');
                    row.innerHTML = `<td colspan='2'>Δεν υπάρχουν διαθέσιμα θέματα.</td>`;
                    tableBody.appendChild(row);
                }
            })
            .catch(error => {
                // Χειρισμός σφαλμάτων
                console.error('Σφάλμα κατά τη φόρτωση των θεμάτων:', error);
                const tableBody = document.getElementById('topics-table-body');
                const row = document.createElement('tr');
                row.innerHTML = `<td colspan='2'>Σφάλμα κατά τη φόρτωση των θεμάτων.</td>`;
                tableBody.appendChild(row);
            });
    });
    </script>
</body>
</html>
