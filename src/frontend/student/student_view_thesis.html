<h3>Προβολή Θέματος Διπλωματικής Εργασίας</h3>
<div id="thesis-details-container">
    <p>Φόρτωση πληροφοριών...</p>
</div>

<script>
// Αρχικοποίηση λειτουργιών όταν φορτώσει η σελίδα
document.addEventListener('DOMContentLoaded', function() {
    // Ανάκτηση στοιχείων διπλωματικής από το API
    fetch('backend/api/student_view_thesis.php')
        .then(response => response.json())
        .then(data => {
            // Εύρεση του container για την εμφάνιση των στοιχείων
            const container = document.getElementById('thesis-details-container');
            
            // Έλεγχος για σφάλματα και εμφάνιση κατάλληλου μηνύματος
            if (data.error) {
                container.innerHTML = `<div class="alert alert-warning">${data.error}</div>`;
            } else {
                // Δημιουργία HTML για την τριμελή επιτροπή
                let committeeHTML = '<h5>Τριμελής Επιτροπή</h5>';
                if (data.committee && data.committee.length > 0) {
                    committeeHTML += '<ul class="list-group">';
                    // Επεξεργασία κάθε μέλους της επιτροπής
                    data.committee.forEach(member => {
                        let roleText = '';
                        let statusText = '';

                        // Καθορισμός του ρόλου του μέλους (Επιβλέπων ή απλό Μέλος)
                        roleText = (member.role === 'supervisor') ? 'Επιβλέπων' : 'Μέλος';

                        // Έλεγχος και εμφάνιση κατάστασης πρόσκλησης για τα απλά μέλη
                        if (member.role === 'member') {
                            // Εκκρεμής πρόσκληση
                            if (member.invitation_status === 'pending') {
                                statusText = ' <span class="badge bg-warning text-dark">Σε εκκρεμότητα</span>';
                            } 
                            // Αποδοχή πρόσκλησης
                            else if (member.invitation_status === 'accepted') {
                                statusText = ` <span class="badge bg-success">Αποδεκτή</span>`;
                                // Προσθήκη ημερομηνίας απάντησης αν υπάρχει
                                if (member.response_date) {
                                    statusText += ` <small class="text-muted">(${member.response_date})</small>`;
                                }
                            } 
                            // Απόρριψη πρόσκλησης
                            else if (member.invitation_status === 'rejected') {
                                statusText = ` <span class="badge bg-danger">Απορρίφθηκε</span>`;
                                // Προσθήκη ημερομηνίας απάντησης αν υπάρχει
                                if (member.response_date) {
                                    statusText += ` <small class="text-muted">(${member.response_date})</small>`;
                                }
                            }
                        }
                        
                        committeeHTML += `
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <div>
                                    <strong>${member.name} ${member.surname}</strong>
                                    <br>
                                    <small class="text-muted">${roleText}</small>
                                </div>
                                <div>
                                    ${statusText}
                                </div>
                            </li>`;
                    });
                    committeeHTML += '</ul>';
                } else {
                    committeeHTML += '<p>Η επιτροπή δεν έχει οριστεί ακόμα.</p>';
                }

                let timeElapsedHTML = '';
                if (data.assignment_date) {
                    const assignmentDate = new Date(data.assignment_date);
                    const now = new Date();
                    const diffTime = Math.abs(now - assignmentDate);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    timeElapsedHTML = `<p class="mt-3"><strong>Χρόνος από την ανάθεση:</strong> ${diffDays} ημέρες</p>`;
                }

                container.innerHTML = `
                    <div class="card">
                        <div class="card-header">
                            <h4>${data.title}</h4>
                        </div>
                        <div class="card-body">
                            <p><strong>Κατάσταση:</strong> <span class="badge ${getStatusBadgeClass(data.status)}">${data.status.replace('_', ' ')}</span></p>
                            <p><strong>Περιγραφή:</strong> ${data.description}</p>
                            ${data.final_text_link ? `<p><strong>Αρχείο Περιγραφής:</strong> <a href="backend/api/view_topic_file.php?topic_id=${data.id}" target="_blank">Προβολή PDF</a></p>` : ''}
                            ${data.draft_file_path ? `<p><strong>Πρόχειρο Κείμενο:</strong> <a href="backend/api/student_view_draft_file.php?thesis_id=${data.id}" target="_blank">Προβολή PDF</a></p>` : ''}
                            <hr>
                            ${committeeHTML}
                            ${timeElapsedHTML}
                        </div>
                    </div>
                `;
            }
        })
        .catch(error => {
            console.error('Σφάλμα:', error);
            document.getElementById('thesis-details-container').innerHTML = '<div class="alert alert-danger">Παρουσιάστηκε σφάλμα κατά την ανάκτηση των δεδομένων.</div>';
        });
});

function getStatusBadgeClass(status) {
    const statusClasses = {
        'under_assignment': 'bg-warning text-dark',
        'active': 'bg-success',
        'under_review': 'bg-info text-dark',
        'completed': 'bg-primary',
        'cancelled': 'bg-danger'
    };
    return statusClasses[status] || 'bg-secondary';
}
</script>
