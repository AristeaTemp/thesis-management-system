<h3>Επεξεργασία Προφίλ</h3>
<p>Εδώ μπορείτε να ενημερώσετε τα στοιχεία επικοινωνίας σας.</p>

<form id="profile-form">
    <div class="mb-3">
        <label for="street" class="form-label">Οδός</label>
        <input type="text" class="form-control" id="street" name="street">
    </div>
    <div class="mb-3">
        <label for="number" class="form-label">Αριθμός</label>
        <input type="text" class="form-control" id="number" name="number">
    </div>
    <div class="mb-3">
        <label for="city" class="form-label">Πόλη</label>
        <input type="text" class="form-control" id="city" name="city">
    </div>
    <div class="mb-3">
        <label for="postcode" class="form-label">Ταχυδρομικός Κώδικας</label>
        <input type="text" class="form-control" id="postcode" name="postcode">
    </div>
    <div class="mb-3">
        <label for="landline_telephone" class="form-label">Σταθερό Τηλέφωνο</label>
        <input type="text" class="form-control" id="landline_telephone" name="landline_telephone">
    </div>
    <div class="mb-3">
        <label for="mobile_telephone" class="form-label">Κινητό Τηλέφωνο</label>
        <input type="text" class="form-control" id="mobile_telephone" name="mobile_telephone" required>
    </div>
     <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" required>
    </div>
    <button type="submit" class="btn btn-primary">Αποθήκευση Αλλαγών</button>
</form>
<div id="form-message" class="mt-3"></div>


<script>
document.addEventListener('DOMContentLoaded', function() {
    // Φόρτωση των υπαρχόντων στοιχείων του προφίλ
    fetch('backend/api/get_student_profile.php')
        .then(response => response.json())
        .then(data => {
            if (!data.error) {
                document.getElementById('street').value = data.street || '';
                document.getElementById('number').value = data.number || '';
                document.getElementById('city').value = data.city || '';
                document.getElementById('postcode').value = data.postcode || '';
                document.getElementById('landline_telephone').value = data.landline_telephone || '';
                document.getElementById('mobile_telephone').value = data.mobile_telephone || '';
                document.getElementById('email').value = data.email || '';
            }
        });

    // Χειρισμός υποβολής της φόρμας
    document.getElementById('profile-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        const messageDiv = document.getElementById('form-message');

        fetch('backend/handlers/update_student_profile.php', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                messageDiv.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
            } else {
                messageDiv.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
            }
        })
        .catch(error => {
            messageDiv.innerHTML = `<div class="alert alert-danger">Παρουσιάστηκε σφάλμα.</div>`;
            console.error('Error:', error);
        });
    });
});
</script>
